<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>AR Island Project (Universal Edition)</title>
    
    <!-- A-Frame (3D Framework) -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    
    <!-- AR.js (Universal Tracking without WebXR) -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
      /* Keep UI clean, AR.js handles the camera */
      body { margin: 0; overflow: hidden; font-family: sans-serif; }
      #loading-overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: #111; color: white; display: flex; flex-direction: column;
        align-items: center; justify-content: center; z-index: 9999;
      }
      #ui-container {
        position: absolute; bottom: 20px; width: 100%; text-align: center;
        color: white; z-index: 10; pointer-events: none;
        text-shadow: 1px 1px 2px black; font-weight: bold;
      }
    </style>

    <script>
      // Component for handling pinch-to-scale, swipe-to-rotate, and swipe-to-move
      AFRAME.registerComponent('touch-controls', {
        init: function () {
          this.initialScale = this.el.object3D.scale.clone();
          this.scaleFactor = 1;
          this.lastX = 0;
          this.lastY = 0;
          this.initialDistance = null;
          this.mode = 'rotate'; // 'rotate' or 'move'
          
          const btn = document.getElementById('toggle-mode');
          if (btn) {
            btn.style.pointerEvents = 'auto';
            btn.addEventListener('click', () => {
              this.mode = this.mode === 'rotate' ? 'move' : 'rotate';
              btn.innerText = 'Mode: ' + (this.mode === 'rotate' ? 'Rotate' : 'Move');
            });
          }
          
          this.el.sceneEl.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
              this.initialDistance = this.getDistance(e.touches);
              this.initialScale = this.el.object3D.scale.clone();
            } else if (e.touches.length === 1) {
              this.lastX = e.touches[0].clientX;
              this.lastY = e.touches[0].clientY;
            }
          });

          this.el.sceneEl.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && this.initialDistance) {
              const currentDistance = this.getDistance(e.touches);
              const scaleRatio = currentDistance / this.initialDistance;
              
              const s = this.initialScale.x * scaleRatio;
              const clampedS = Math.max(0.01, Math.min(s, 0.2)); 
              this.el.object3D.scale.set(clampedS, clampedS, clampedS);
              
            } else if (e.touches.length === 1) {
              const currentX = e.touches[0].clientX;
              const currentY = e.touches[0].clientY;
              const deltaX = currentX - this.lastX;
              const deltaY = currentY - this.lastY;
              
              if (this.mode === 'rotate') {
                this.el.object3D.rotation.y += deltaX * 0.01;
              } else {
                this.el.object3D.position.x += deltaX * 0.005;
                this.el.object3D.position.z += deltaY * 0.005;
              }
              
              this.lastX = currentX;
              this.lastY = currentY;
            }
          });

          this.el.sceneEl.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
              this.initialDistance = null;
            }
          });
        },
        getDistance: function(touches) {
          const dx = touches[0].clientX - touches[1].clientX;
          const dy = touches[0].clientY - touches[1].clientY;
          return Math.sqrt(dx * dx + dy * dy);
        }
      });

      // Component to dynamically clone trees onto the island once models load
      AFRAME.registerComponent('island-populator', {
        init: function () {
          const islandEl = this.el;
          const treesEl = document.querySelector('#trees-container');

          // Hide loading screen when island loads
          islandEl.addEventListener('model-loaded', () => {
            document.getElementById('loading-overlay').style.display = 'none';
            const islandObject = islandEl.getObject3D('mesh');
            
            // Check if trees are ready
            const treesObject = treesEl.getObject3D('mesh');
            if (treesObject) {
              this.populate(islandObject, treesObject);
            } else {
              treesEl.addEventListener('model-loaded', () => {
                this.populate(islandObject, treesEl.getObject3D('mesh'));
              });
            }
          });
        },
        populate: function(island, treesGroup) {
          const treeMeshes = [];
          treesGroup.traverse((child) => {
             if(child.name.includes('Tree') && child.isMesh) {
                treeMeshes.push(child);
             }
          });

          island.traverse((node) => {
            if (node.name && node.name.includes('tree_swapn')) {
              if (treeMeshes.length > 0) {
                const randomTree = treeMeshes[Math.floor(Math.random() * treeMeshes.length)].clone();
                randomTree.position.copy(node.position);
                randomTree.rotation.copy(node.rotation);
                randomTree.scale.copy(node.scale);
                node.parent.add(randomTree);
              }
            }
          });
        }
      });
    </script>
  </head>
  
  <body>
    <div id="loading-overlay">
      <h2>Loading Universal AR Engine...</h2>
      <p>Please allow camera permissions when prompted.</p>
    </div>

    <!-- 
      arjs: Enables universal camera tracking
      gltf-model: Configures Draco compression decoder automatically 
    -->
    <a-scene 
      embedded 
      arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;" 
      gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/versioned/decoders/1.5.6/;"
      renderer="antialias: true; alpha: true; colorManagement: true;"
      vr-mode-ui="enabled: false">
      
      <a-assets>
        <!-- The paths must be relative so Vite copies them correctly to GitHub Pages -->
        <a-asset-item id="island-gltf" src="./island6_model.glb"></a-asset-item>
        <a-asset-item id="trees-gltf" src="./trees.glb"></a-asset-item>
      </a-assets>

      <!-- The universally recognized AR.js Hiro Marker -->
      <a-marker preset="hiro">
        <!-- Scale the island to fit the marker and attach our custom populator -->
        <a-entity 
          id="island-container" 
          gltf-model="#island-gltf" 
          scale="0.05 0.05 0.05" 
          position="0 0 0" 
          rotation="0 0 0"
          island-populator
          touch-controls>
        </a-entity>
        
        <!-- We load the trees invisibly just to extract their meshes -->
        <a-entity id="trees-container" gltf-model="#trees-gltf" visible="false"></a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
    
    <div id="ui-container">
      <p style="margin-bottom: 10px;">Pinch to scale</p>
      <button id="toggle-mode" style="padding: 10px 20px; font-size: 16px; border-radius: 8px; border: none; background: #0ea5e9; color: white; margin-bottom: 20px; cursor: pointer;">Mode: Rotate</button>
    </div>
  </body>
</html>
